name: RoleVow — Public Release Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Essential technical files and integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public candidate
        uses: actions/checkout@v4
      - name: Verify source files and edition boundaries
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            README.md BOOTSTRAP.md START-HERE.md \
            core/CORE.md player/PLAYER.md master/MASTER.md protocols/PROTOCOLS.md \
            multiplayer/HOSTED-PLAY.md \
            adapters/5e-srd51/ADAPTER.md \
            adapters/5e-srd521/ADAPTER.md \
            adapters/dh-srd20/ADAPTER.md \
            library/MASTER-CRAFT-TOOLBOX.md library/PATTERN-INDEX.md \
            feedback/FEEDBACK-AND-METRICS.md \
            RUNTIME-HOTFIX-V0.3.2.md RUNTIME-HOTFIX-V0.3.2-BASE.md \
            RUNTIME-HOTFIX-V0.3.3.md RUNTIME-HOTFIX-V0.3.4.md \
            RUNTIME-HOTFIX-V0.3.5.md RUNTIME-HOTFIX-V0.3.6.md \
            RUNTIME-V0.4-CANDIDATE.md V0.4-CANDIDATE.md \
            SYSTEM-SUPPORT.md KNOWN-LIMITATIONS.md \
            THIRD-PARTY-NOTICES.md LICENSE LICENSE-DOCS.md PRIVACY.md LEGAL-CLAIMS.md \
            index.html landing.css landing.js .github/workflows/landing-pages.yml; do
            test -s "$file"
          done
          grep -q 'SRD 5.2.1' adapters/5e-srd521/ADAPTER.md
          grep -q 'SRD 5.1' adapters/5e-srd51/ADAPTER.md
          grep -q 'Daggerheart' adapters/dh-srd20/ADAPTER.md
          grep -qi 'hosted' multiplayer/HOSTED-PLAY.md
          # The indemnity programme is active; gameplay remains a technical playtest.
          grep -q 'ACTIVE — launched 19 November 2026' README.md
          grep -q 'Ultra-Guarantee is active' BOOTSTRAP.md
          grep -q 'guarantee/TERMS.md' README.md
          node --check landing.js
      - name: Run deterministic contract regression suite
        shell: bash
        run: |
          python3 -m pip install beautifulsoup4==4.13.4
          python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Machine checks are not a gameplay or license approval
        shell: bash
        run: |
          echo 'Static technical checks only. No gameplay/legal/DPCGL approval implied.'
