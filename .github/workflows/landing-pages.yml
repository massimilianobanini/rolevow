name: RoleVow Landing — GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - landing.css
      - landing.js
      - assets/brand/rolevow-visual-hammer-transparent.png
      - .github/workflows/landing-pages.yml
  pull_request:
    paths:
      - index.html
      - landing.css
      - landing.js
      - .github/workflows/landing-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rolevow-landing-pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify public site files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s landing.css
          test -s landing.js
          test -s assets/brand/rolevow-visual-hammer-transparent.png
          node --check landing.js
          if grep -Eq 'docs\.google\.com/forms/|drive\.google\.com/file/d/' index.html landing.js; then
            echo 'Unexpected direct form or private file link' >&2; exit 1
          fi
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare minimal static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets/brand
          cp index.html landing.css landing.js _site/
          cp assets/brand/rolevow-visual-hammer-transparent.png _site/assets/brand/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/brand/rolevow-visual-hammer-transparent.png
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
