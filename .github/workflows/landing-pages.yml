name: RoleVow — Landing Preview Deploy (MANUAL ONLY)

# No automatic deployment from a branch push. Requires separate reviewed release approval.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate basic static site
        run: |
          set -euo pipefail
          test -s index.html
          test -s landing.css
          test -s landing.js
          node --check landing.js
          if grep -Eq 'docs\.google\.com/forms/|drive\.google\.com/file/d/' index.html landing.js; then
            echo 'Unexpected private/external form reference' >&2; exit 1
          fi
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp index.html landing.css landing.js _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
